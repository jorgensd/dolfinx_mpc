name: Test MPC

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      coverage_only:
        description: Only run the configuration that produces the coverage report
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  schedule:
    # '*' is a special character in YAML, so string must be quoted
    - cron: "0 8 * * *"

# A new push to a pull request cancels the run it makes obsolete.
# Runs on main and the nightly run are never cancelled.
concurrency:
  group: test-mpc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check Python formatting
        run: |
          pipx run ruff check
          pipx run ruff format --check

      - name: Check C++ formatting
        run: pipx run --spec clang-format==22.1.3 clang-format --dry-run --Werror cpp/*.h cpp/*.cpp python/src/dolfinx_mpc/*.cpp

      # Without DOLFINx installed, its imports are untyped (ignore_missing_imports)
      - name: Check typing
        run: |
          cd python
          pipx run mypy . --exclude=build

  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.set.outputs.value }}
    steps:
      - id: set
        run: |
          if [[ "${{ inputs.coverage_only }}" == "true" ]]; then
            echo 'value={"build_mode":["Release"],"petsc_arch":["linux-gnu-real64-32"]}' >> "${GITHUB_OUTPUT}"
          else
            echo 'value={"build_mode":["Release","Debug"],"petsc_arch":["linux-gnu-complex128-32","linux-gnu-complex64-32","linux-gnu-real64-32","linux-gnu-real32-32"]}' >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: [lint, matrix]
    runs-on: ubuntu-latest
    # Guards against an MPI deadlock holding the runner for the 6 hour default
    timeout-minutes: 120
    container: ghcr.io/fenics/dolfinx/dev-env:current-mpich

    strategy:
      # Report every configuration, not just the first failure
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.value) }}
    env:
      DOLFINX_BRANCH: main
      BASIX_BRANCH: main
      UFL_BRANCH: main
      FFCX_BRANCH: main

      CC: cc
      CXX: c++
      PETSC_ARCH: "${{ matrix.petsc_arch }}"
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      OMPI_MCA_rmaps_base_oversubscribe: 1
      OMPI_MCA_plm: isolated
      OMPI_MCA_btl_vader_single_copy_mechanism: none
      OMPI_MCA_mpi_yield_when_idle: 1
      OMPI_MCA_hwloc_base_binding_policy: none
      HDF5_MPI: "ON"
      HDF5_DIR: "/usr/local/"
      MPC_BUILD_MODE: ${{ matrix.build_mode }}
      MPC_CMAKE_CXX_FLAGS: "-Wall -Werror -g -pedantic -Ofast -march=native"
      DEB_PYTHON_INSTALL_LAYOUT: deb_system
      MPC_RUN: coverage run --rcfile=.coveragerc -m mpi4py
    defaults:
      run:
        # The container's default is sh; bash gives arrays, [[ ]] and -eo pipefail
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: upgrade pip
        run: python3 -m pip install  --upgrade setuptools pip

      - name: Install h5py
        run: |
          python3 -m pip install --no-build-isolation  --no-cache-dir --no-binary=h5py h5py

      - name: Install DOLFINx
        uses: jorgensd/actions/install-dolfinx@v0.4
        with:
          dolfinx: ${{ env.DOLFINX_BRANCH }}
          ufl: ${{ env.UFL_BRANCH }}
          basix: ${{ env.BASIX_BRANCH }}
          ffcx: ${{ env.FFCX_BRANCH }}
          petsc_arch: ${{ env.PETSC_ARCH }}

      - name: Install DOLFINx-MPC (C++)
        run: |
          cmake -G Ninja -B build-dir -DCMAKE_BUILD_TYPE=${MPC_BUILD_MODE} -DCMAKE_CXX_FLAGS="${MPC_CMAKE_CXX_FLAGS}" -S cpp/
          cmake --build build-dir
          cmake --install build-dir

      - name: Install DOLFINx-MPC (Python)
        run: python3 -m pip -v install  --config-settings=cmake.build-type=${MPC_BUILD_MODE} --no-build-isolation  -e python/[test,optional,docs]

      - name: Run tests
        run: |
          for n in 1 2 3 4; do
            echo "::group::pytest on ${n} process(es)"
            mpirun -n ${n} ${MPC_RUN} -m pytest python/tests -xvs
            echo "::endgroup::"
          done

      - name: Run benchmarks
        run: |
          mpirun -n 2 ${MPC_RUN} python/benchmarks/bench_periodic.py --nref=2 --tet --gamg --timings
          mpirun -n 2 ${MPC_RUN} python/benchmarks/bench_elasticity_edge.py --nref=2 --gamg --timings
          mpirun -n 2 ${MPC_RUN} python/benchmarks/bench_contact_3D.py

      - name: Run demos
        run: |
          # Every python/demos/demo_*.py runs without arguments, except those
          # listed here: the contact demos run in the next step with each
          # option set
          skip="demo_contact_2D.py demo_contact_3D.py"
          for n in 1 2; do
            for demo in python/demos/demo_*.py; do
              [[ " ${skip} " == *" $(basename ${demo}) "* ]] && continue
              echo "::group::${demo} on ${n} process(es)"
              mpirun -n ${n} ${MPC_RUN} ${demo}
              echo "::endgroup::"
            done
          done

      - name: Run contact demos
        run: |
          declare -A options=(
            [2D]="|--gmsh|--quad --gmsh"
            [3D]="|--gmsh|--gmsh --no-slip|--gmsh --no-slip --hex"
          )
          for n in 1 2; do
            for dim in 2D 3D; do
              IFS="|" read -ra opts <<< "${options[${dim}]}"
              for opt in "${opts[@]}"; do
                for theta in 0 1.05; do
                  echo "::group::demo_contact_${dim}.py ${opt} --theta ${theta} on ${n} process(es)"
                  mpirun -n ${n} ${MPC_RUN} python/demos/demo_contact_${dim}.py ${opt} --theta ${theta} --timing
                  echo "::endgroup::"
                done
              done
            done
          done

      - name: Combine coverage reports
        run: |
          coverage combine
          coverage report -m
          coverage html

      - name: Upload coverage report as artifact
        if: matrix.build_mode == 'Release' && matrix.petsc_arch == 'linux-gnu-real64-32'
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: htmlcov
          if-no-files-found: error
