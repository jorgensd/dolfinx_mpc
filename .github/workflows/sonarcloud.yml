name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # avoid running on pull requests from forks
    # which don't have access to secrets
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    container: ghcr.io/fenics/dolfinx/dev-env:current-mpich
    env:
      PETSC_ARCH: linux-gnu-real64-32
      PETSC_DIR: /usr/local/petsc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Install DOLFINx
        uses: jorgensd/actions/install-dolfinx@v0.4
        with:
          petsc_arch: ${{ env.PETSC_ARCH }}
          dolfinx: main
          basix: main
          ufl: main
          ffcx: main

      # The compilation database is what SonarCloud analyses the C++ against
      # (sonar.cfamily.compile-commands in sonar-project.properties)
      - name: Build DOLFINx-MPC (C++)
        run: |
          cmake -G Ninja -B build-dir -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S cpp/
          cmake --build build-dir --parallel 3

      - name: Run sonar-scanner
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
