name: Build and deploy docs

# Every version is deployed through GitHub Pages' Actions source.
# Built HTML of each release is kept as an asset of the "docs-archive"
# release, so tagged versions are built once and the repo never grows.

on:
  push:
    branches: [main]        # rebuilds nightly/"main" docs on every push
  schedule:
    - cron: "0 4 * * *"    # also run nightly in case dolfinx:nightly moved
  workflow_dispatch:        # manual trigger (e.g. after editing docs-versions.yml)

permissions:
  contents: write           # to upload to the docs-archive release
  pages: write
  id-token: write

# Allow one concurrent deployment, without cancelling one that is in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ARCHIVE: docs-archive     # release (and tag) holding the built HTML
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # ── Step 1: read the version config and decide what to build ──────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: List archived builds
        run: |
          gh release view "$ARCHIVE" --json assets --jq '.assets[].name' > archived.txt \
            || touch archived.txt   # release doesn't exist before the first run
          cat archived.txt

      - name: Build job matrix
        id: set-matrix
        run: python3 .github/scripts/docs_site.py matrix archived.txt

  # ── Step 2: build each version that needs it ──────────────────────────────
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ${{ matrix.dolfinx_image }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      fail-fast: false    # a broken nightly shouldn't block a tagged build
    env:
      PYVISTA_OFF_SCREEN: false
      PYVISTA_JUPYTER_BACKEND: "html"
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow

    steps:
      - name: Checkout dolfinx_mpc at ${{ matrix.git_ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.git_ref }}

      - name: Install OpenGL libraries for pyvista
        run: |
          apt-get update
          apt-get install -y libgl1-mesa-dev mesa-utils libosmesa6

      - name: Install DOLFINx-MPC (C++)
        run: |
          cmake -G Ninja -B build-dir -DCMAKE_BUILD_TYPE=Release -S cpp/
          cmake --build build-dir --parallel 3
          cmake --install build-dir

      # Older tags don't bound jupyter-book, and the book config needs 1.x
      - name: Install DOLFINx-MPC (Python)
        run: python3 -m pip -v install --config-settings=cmake.build-type="Release" --no-build-isolation ./python/[docs] "jupyter-book<2.0"

      - name: Build docs
        run: jupyter-book build .

      # A tarball keeps hidden files and permissions, and is what gets archived
      - name: Package HTML
        run: tar -czf "docs-${{ matrix.git_ref }}.tar.gz" -C _build/html .

      - name: Upload built HTML as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.label }}
          path: docs-${{ matrix.git_ref }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  run-coverage:
    uses: ./.github/workflows/test_mpc.yml
    with:
      # Only the real64 Release run uploads the coverage report used below
      coverage_only: true

  # ── Step 3: archive new builds, assemble all versions and deploy ──────────
  deploy:
    needs: [plan, build, run-coverage]
    # Publish whatever built, even if one version failed
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dolfinx_mpc (version list and flyout)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Download freshly built versions
        uses: actions/download-artifact@v8
        with:
          pattern: docs-*
          path: fresh/
          merge-multiple: true

      # main is archived too, so a failed nightly falls back to the last good one
      - name: Archive new builds
        run: |
          gh release view "$ARCHIVE" > /dev/null 2>&1 \
            || gh release create "$ARCHIVE" --prerelease --latest=false \
                 --title "Documentation archive" \
                 --notes "Built HTML of each documented version, used by the docs deployment. Do not delete."
          shopt -s nullglob
          for f in fresh/docs-*.tar.gz; do
            gh release upload "$ARCHIVE" "$f" --clobber
          done

      - name: Assemble site
        run: python3 .github/scripts/docs_site.py assemble fresh site

      - name: Download coverage report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: code-coverage-report
          path: site/code-coverage-report

      # Read the Docs-style injection: one root script serves every version
      - name: Inject version flyout
        run: |
          cp .github/docs-version-flyout.js site/version-flyout.js
          tag='<script defer src="/dolfinx_mpc/version-flyout.js"></script>'
          for label in $(python3 .github/scripts/docs_site.py labels site); do
            find "site/${label}" -name '*.html' -print0 \
              | xargs -0 sed -i "s#</head>#${tag}</head>#"
          done

      # Drop archived builds of tags no longer listed in docs-versions.yml
      - name: Prune archive
        run: |
          keep=$(python3 .github/scripts/docs_site.py assets)
          for asset in $(gh release view "$ARCHIVE" --json assets --jq '.assets[].name'); do
            case " ${keep} " in
              *" ${asset} "*) ;;
              *) echo "Removing ${asset}"; gh release delete-asset "$ARCHIVE" "$asset" --yes ;;
            esac
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
