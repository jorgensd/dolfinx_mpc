name: Build docs

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: ghcr.io/fenics/dolfinx/dev-env:stable
    env:
      # Directory that will be published on github pages
      PUBLISH_DIR: ./_build/html
      PETSC_ARCH: "linux-gnu-real64-32"
      PYVISTA_OFF_SCREEN: false
      PYVISTA_JUPYTER_BACKEND: "html"
      VTK_DEFAULT_OPENGL_WINDOW: vtkOSOpenGLRenderWindow

    steps:
      - uses: actions/checkout@v7
        # with:
        #   ref: release

      - name: Install OpenGL libraries for pyvista
        run: |
          apt-get update
          apt-get install -y libgl1-mesa-dev mesa-utils libosmesa6

      - name: Install DOLFINx
        uses: jorgensd/actions/install-dolfinx@v0.4
        with:
          dolfinx: main #v0.11.0.post0
          ufl: main #2026.1.0
          ffcx: main #v0.11.0
          basix: main #v0.11.0
          petsc_arch: ${{ env.PETSC_ARCH }}

      - name: Install DOLFINx-MPC (C++)
        run: |
          cmake -G Ninja -B build-dir -DCMAKE_BUILD_TYPE=Release -S cpp/
          cmake --build build-dir --parallel 3
          cmake --install build-dir

      - name: Install DOLFINx-MPC (Python)
        run: python3 -m pip -v install --config-settings=cmake.build-type="Release" --no-build-isolation  ./python/[docs,test,optional]

      - name: Build docs
        run: jupyter book build .

      - name: Upload documentation as artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
